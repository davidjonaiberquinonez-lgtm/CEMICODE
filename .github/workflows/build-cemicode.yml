name: build-cemicode

# Repo liviano: solo capa CEMICODE. Upstream se clona fresco en CI.
on:
  workflow_dispatch:
  push:
    paths:
      - "patches/cemicode-ui-branding.patch"
      - "scripts/apply-cemicode-branding.py"
      - "cemicode-branding/**"
      - "opencode.json"
      - ".opencode/**"
      - ".github/workflows/build-cemicode.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clonar upstream (MIT, anomalyco/opencode, depth 1)
        run: git clone --depth 1 https://github.com/anomalyco/opencode.git opencode-upstream

      - name: Setup bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Aplicar branding CEMICODE (parche documentado)
        run: |
          python3 scripts/apply-cemicode-branding.py
          python3 scripts/apply-cemicode-branding.py --check

      - name: Instalar dependencias upstream
        working-directory: opencode-upstream
        run: bun install

      - name: Compilar binarios cemicode (matriz completa, con Web UI embebida)
        working-directory: opencode-upstream/packages/opencode
        env:
          OPENCODE_CHANNEL: prod
        run: bun run script/build.ts

      - name: Empaquetar portables rebrandeados (linux + windows)
        run: |
          ls opencode-upstream/packages/opencode/dist/
          mkdir -p dist
          for TARGET in linux-x64 windows-x64; do
            D="opencode-upstream/packages/opencode/dist/opencode-${TARGET}/bin"
            ls "$D"
            if [ "$TARGET" = "windows-x64" ]; then
              SRC="$D/opencode.exe"; [ -f "$SRC" ] || SRC="$D/opencode"
              EXE=".exe"
            else
              SRC="$D/opencode"; EXE=""
            fi
            [ -f "$SRC" ] || { echo "FALTA binario en $D"; exit 1; }
            P="dist-portable-${TARGET}"
            rm -rf "$P"; mkdir -p "$P/bin" "$P/.opencode" "$P/scripts"
            cp "$SRC" "$P/bin/cemicode${EXE}"
            cp opencode.json .env.example README_CEMICODE.md AGENTS.md "$P/"
            cp -r .opencode/agents "$P/.opencode/"
            cp -r .opencode/themes "$P/.opencode/" 2>/dev/null || true
            cp .opencode/tui.json "$P/.opencode/"
            cp -r cemicode-branding "$P/"
            cp scripts/cemicode-auth.py scripts/cemicode-chat.py "$P/scripts/"
            cp packaging/ejecutar-cemicode.bat packaging/ejecutar-cemicode-web.bat packaging/LEEME-PORTABLE.txt "$P/"
            cp cemicode-branding/icons/cemicode.ico "$P/"
            (cd "$P" && zip -r "../dist/CEMICODE-Portable-${TARGET}-rebranded.zip" .)
          done
          ./dist-portable-linux-x64/bin/cemicode --version

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: cemicode-portables-rebranded
          path: dist/CEMICODE-Portable-*-rebranded.zip
